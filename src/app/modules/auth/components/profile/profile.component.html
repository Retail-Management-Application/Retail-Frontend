<div class="profile-container" *ngIf="user">
  <h2>My Profile</h2>

  <div class="profile-card">
    <p><strong>Name:</strong>  {{ user.fullName }}</p>
    <p><strong>Email:</strong> {{ user.email }}</p>
    <p><strong>Role:</strong>  {{ user.role }}</p>
  </div>

  <button (click)="logout()">Logout</button>
</div>
