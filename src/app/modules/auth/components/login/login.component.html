<div class="auth-container">

  <div class="auth-card">

    <div class="auth-header">
      <div class="auth-icon">🔐</div>
      <h2>Welcome back</h2>
      <p class="auth-subtitle">Sign in to your account</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <span class="input-icon">✉</span>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            [class.input-error]="email?.invalid && email?.touched"
          />
        </div>
        <span class="error" *ngIf="email?.touched && email?.hasError('required')">
          Email is required.
        </span>
        <span class="error" *ngIf="email?.touched && email?.hasError('email')">
          Invalid email format.
        </span>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Enter your password"
            [class.input-error]="password?.invalid && password?.touched"
          />
          <span class="toggle-eye" (click)="togglePassword()">
            {{ showPassword ? '🙈' : '👁' }}
          </span>
        </div>
        <span class="error" *ngIf="password?.touched && password?.hasError('required')">
          Password is required.
        </span>
      </div>

      <!-- Server error -->
      <div class="server-error" *ngIf="errorMsg">
        ⚠ {{ errorMsg }}
      </div>

      <!-- Submit -->
      <button type="submit" [disabled]="loading" class="btn-primary">
        <span *ngIf="!loading">Sign In</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>

    </form>

    <p class="auth-footer">
      Don't have an account?
      <a routerLink="/auth/register">Create one</a>
    </p>

  </div>
</div>
