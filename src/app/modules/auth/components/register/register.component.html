<div class="auth-container">
  <h2>Register</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" formControlName="fullName" placeholder="John Doe"/>
      <span class="error" *ngIf="form.get('fullName')?.invalid && form.get('fullName')?.touched">
        Full name is required.
      </span>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="you@example.com"/>
      <span class="error" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
        Valid email is required.
      </span>
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" formControlName="password" placeholder="Min. 6 characters"/>
      <span class="error" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
        Password must be at least 6 characters.
      </span>
    </div>

    <div class="form-group">
      <label>Phone Number</label>
      <input type="text" formControlName="phoneNumber" placeholder="+1 234 567 8900"/>
    </div>

    <div class="form-group">
      <label>Address</label>
      <input type="text" formControlName="address" placeholder="123 Main St"/>
    </div>

    <span class="error" *ngIf="errorMsg">{{ errorMsg }}</span>

    <button type="submit" [disabled]="loading">
      {{ loading ? 'Registering…' : 'Register' }}
    </button>

  </form>

  <p>Already have an account? <a routerLink="/auth/login">Login</a></p>
</div>
