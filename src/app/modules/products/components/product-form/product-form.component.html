<div class="container py-4" style="max-width: 700px;">

  <h4 class="fw-bold mb-4">
    {{ isEditMode ? '✏️ Edit Product' : '➕ Add New Product' }}
  </h4>

  <div class="text-center py-4" *ngIf="isLoading">
    <div class="spinner-border" role="status"></div>
  </div>

  <div class="alert alert-success" *ngIf="successMsg">✅ {{ successMsg }}</div>
  <div class="alert alert-danger" *ngIf="errorMsg">❌ {{ errorMsg }}</div>

  <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!isLoading">
    <div class="card shadow-sm">
      <div class="card-body">

        <!-- Name -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Product Name <span class="text-danger">*</span></label>
          <input type="text" class="form-control" formControlName="name"
            [class.is-invalid]="isInvalid('name')">
          <div class="invalid-feedback">Name is required (max 200 chars).</div>
        </div>

        <!-- Description -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Description</label>
          <textarea class="form-control" formControlName="description" rows="3"
            [class.is-invalid]="isInvalid('description')"></textarea>
          <div class="invalid-feedback">Max 1000 characters.</div>
        </div>

        <!-- Price -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Price (₹) <span class="text-danger">*</span></label>
          <input type="number" class="form-control" formControlName="price" min="0.01" step="0.01"
            [class.is-invalid]="isInvalid('price')">
          <div class="invalid-feedback">Enter a valid price greater than 0.</div>
        </div>

        <!-- Category & Brand -->
        <div class="row">
          <div class="col-6 mb-3">
            <label class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
            <select class="form-select" formControlName="categoryId"
              [class.is-invalid]="isInvalid('categoryId')">
              <option [ngValue]="null" disabled>Select category...</option>
              <option *ngFor="let cat of categories" [value]="cat.categoryId">{{ cat.categoryName }}</option>
            </select>
            <div class="invalid-feedback">Category is required.</div>
          </div>
          <div class="col-6 mb-3">
            <label class="form-label fw-semibold">Brand <span class="text-danger">*</span></label>
            <select class="form-select" formControlName="brandId"
              [class.is-invalid]="isInvalid('brandId')">
              <option [ngValue]="null" disabled>Select brand...</option>
              <option *ngFor="let brand of brands" [value]="brand.brandId">{{ brand.brandName }}</option>
            </select>
            <div class="invalid-feedback">Brand is required.</div>
          </div>
        </div>

        <!-- Image URL -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Image URL</label>
          <input type="url" class="form-control" formControlName="imageUrl" placeholder="https://...">
        </div>

        <!-- Stock & Reorder -->
        <div class="row">
          <div class="col-6 mb-3">
            <label class="form-label fw-semibold">
              {{ isEditMode ? 'Current Stock' : 'Initial Stock' }} <span class="text-danger">*</span>
            </label>
            <input type="number" class="form-control" formControlName="initialStock" min="0"
              [class.is-invalid]="isInvalid('initialStock')">
            <div class="invalid-feedback">Stock cannot be negative.</div>
          </div>
          <div class="col-6 mb-3">
            <label class="form-label fw-semibold">Reorder Level <span class="text-danger">*</span></label>
            <input type="number" class="form-control" formControlName="reorderLevel" min="0"
              [class.is-invalid]="isInvalid('reorderLevel')">
            <div class="invalid-feedback">Reorder level cannot be negative.</div>
          </div>
        </div>

        <!-- Active Toggle -->
        <div class="mb-3 form-check form-switch">
          <input class="form-check-input" type="checkbox" id="isActive" formControlName="isActive">
          <label class="form-check-label fw-semibold" for="isActive">Active (visible to customers)</label>
        </div>

      </div>

      <div class="card-footer d-flex gap-2 justify-content-end">
        <button type="button" class="btn btn-outline-secondary" (click)="cancel()">Cancel</button>
        <button type="submit" class="btn btn-dark fw-bold" [disabled]="isSaving">
          <span *ngIf="isSaving" class="spinner-border spinner-border-sm me-2"></span>
          {{ isEditMode ? 'Update Product' : 'Create Product' }}
        </button>
      </div>
    </div>
  </form>

</div>
