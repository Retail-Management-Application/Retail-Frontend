<div class="container py-4" style="max-width:680px">
  <h2 class="mb-4">Checkout</h2>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary"></div>
  </div>

  <div *ngIf="!loading">

    <!-- Order summary -->
    <div *ngIf="cart && cart.items.length > 0" class="card mb-4 p-3">
      <h5 class="mb-3">Order Summary</h5>
      <ul class="list-group list-group-flush">
        <li class="list-group-item d-flex justify-content-between"
            *ngFor="let item of cart.items">
          <span>{{ item.productName }} × {{ item.quantity }}</span>
          <span>Rs. {{ item.subtotal | number:'1.2-2' }}</span>
        </li>
        <li class="list-group-item d-flex justify-content-between fw-bold">
          <span>Total</span>
          <span>Rs. {{ cart.total | number:'1.2-2' }}</span>
        </li>
      </ul>
    </div>

    <!-- Success message -->
    <div *ngIf="success" class="alert alert-success text-center">
      ✅ Order placed successfully! Redirecting to your orders…
    </div>

    <!-- Form -->
    <form *ngIf="!success" [formGroup]="form" (ngSubmit)="placeOrder()">
      <div *ngIf="message" class="alert alert-danger">{{ message }}</div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Shipping Address</label>
        <textarea class="form-control" rows="3"
                  formControlName="shippingAddress"
                  placeholder="Enter full delivery address"></textarea>
        <div *ngIf="f['shippingAddress'].touched && f['shippingAddress'].invalid"
             class="text-danger small mt-1">
          Address is required (min 10 chars).
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Coupon Code <span class="text-muted">(optional)</span></label>
        <input class="form-control" type="text"
               formControlName="couponCode"
               placeholder="e.g. SAVE10" />
      </div>

      <div class="d-flex gap-2">
        <button type="button" class="btn btn-outline-secondary"
                routerLink="/cart">← Back to Cart</button>
        <button type="submit" class="btn btn-primary px-4" [disabled]="placing">
          <span *ngIf="placing" class="spinner-border spinner-border-sm me-2"></span>
          Place Order
        </button>
      </div>
    </form>
  </div>
</div>
